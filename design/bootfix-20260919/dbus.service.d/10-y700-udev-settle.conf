# Y700 (boot 8e18ad1f): dbus-daemon failed 5x at 17:02:54.13 with "Failed to open /dev/null: Permission denied"
# while udev coldplug was still being processed (mem nodes touched at 54.386). Start dbus after the queue settles.
[Service]
# "-": a settle timeout must not block dbus itself
ExecStartPre=-+/usr/bin/udevadm settle --timeout=15
