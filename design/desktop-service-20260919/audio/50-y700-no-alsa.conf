# WirePlumber (installed to ~/.config/wireplumber/wireplumber.conf.d/): never open ALSA devices on the Y700.
# The canoe sound card exposes ~40 AudioReach backend PCMs that only work together with a DSP graph; the speakers are
# driven by speakerd.py through the "Y700 Speakers" pipe sink instead. Cameras are not used either.
wireplumber.profiles = {
    main = {
        monitor.alsa      = disabled
        monitor.alsa-midi = disabled
        monitor.v4l2      = disabled
        monitor.libcamera = disabled
    }
}
