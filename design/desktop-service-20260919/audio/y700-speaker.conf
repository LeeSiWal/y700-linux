# PipeWire client process (pipewire -c <this file>) started by phosh-session.sh: one pipe-tunnel sink "Y700 Speakers"
# that writes s16le/2ch/48k into $XDG_RUNTIME_DIR/y700-speaker.fifo. speakerd.py (root, nextboot-impl) reads the FIFO and
# plays it through the ADSP speaker graph. Modeled on /usr/share/pipewire/filter-chain.conf (client-only config).
context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-pipe-tunnel
        args = {
            tunnel.mode      = sink
            pipe.filename    = "/run/y700-desktop/y700-speaker.fifo"
            audio.format     = S16LE
            audio.rate       = 48000
            audio.channels   = 2
            audio.position   = [ FL FR ]
            node.name        = "y700_speakers"
            node.description = "Y700 Speakers"
            stream.props = {
                priority.session = 2000
                priority.driver  = 2000
            }
        }
    }
]
